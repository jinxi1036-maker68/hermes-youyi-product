[Unit]
Requires=hermes-youyi-agnes-egress.service
After=hermes-youyi-agnes-egress.service

[Service]
# The loopback egress only routes Agnes through the configured upstream.
# It relays all other HTTPS destinations directly from the server.
Environment="HTTP_PROXY=http://127.0.0.1:18889"
Environment="HTTPS_PROXY=http://127.0.0.1:18889"
Environment="NO_PROXY=127.0.0.1,localhost"
Environment="HERMES_AGNES_EGRESS_LABEL=agnes_dedicated_upstream"
