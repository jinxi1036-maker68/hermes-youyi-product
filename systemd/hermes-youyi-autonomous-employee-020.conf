[Unit]
Description=Hermes Youyi v0.20 model-led autonomous employee loop

[Service]
Environment=HERMES_AUTONOMOUS_WAKEUP_MATERIALIZE_LEDGER=1
Environment=HERMES_AUTONOMOUS_EMPLOYEE_LOOP=1
Environment=HERMES_MULTI_AGENT_SHADOW=1
Environment=HERMES_CONFIG_PATH=/opt/hermes-youyi-current/home-proddata/config.yaml
Environment=HERMES_XIAOYOU_AGNES_ONLY=1
Environment=HERMES_AUTONOMOUS_MODEL_TIMEOUT_SECONDS=25
