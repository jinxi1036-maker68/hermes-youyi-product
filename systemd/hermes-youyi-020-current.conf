[Unit]
Description=Hermes Youyi 0.20 Production Gateway (version-neutral)

[Service]
WorkingDirectory=/opt/hermes-youyi-current/runtime
EnvironmentFile=
EnvironmentFile=/opt/hermes-youyi/config/runtime.secrets.env
EnvironmentFile=/opt/hermes-youyi-current/config/runtime.gateway.020.env
ExecStart=
ExecStart=/opt/hermes-youyi-current/.venv/bin/hermes gateway run --accept-hooks
ReadWritePaths=
ReadWritePaths=/opt/hermes-youyi/data /opt/hermes-youyi/logs /opt/hermes-youyi/config /opt/hermes-youyi-current /opt/hermes-youyi-upgrade-0.20.0
StandardOutput=journal
StandardError=journal
