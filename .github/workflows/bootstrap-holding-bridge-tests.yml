name: Bootstrap Holding Bridge Tests

on:
  push:
    branches:
      - main
      - feat/bootstrap-holding-bridge-v1
    paths:
      - runtime/plugins/platforms/wecom/holding_bridge.py
      - runtime/plugins/platforms/wecom/inbound_receipts.py
      - runtime/tests/plugins/test_wecom_holding_bridge_v1.py
      - runtime/tests/plugins/test_xiaoyou_runtime_home_migration_v1.py
      - scripts/xiaoyou_runtime_home_migration.py
      - scripts/xiaoyou_wecom_holding_mode.py
      - deploy/config/runtime.wecom-holding.env.example
      - deploy/systemd/xiaoyou-wecom-holding-bridge.service.example
      - .github/workflows/bootstrap-holding-bridge-tests.yml
  pull_request:
    paths:
      - runtime/plugins/platforms/wecom/holding_bridge.py
      - runtime/plugins/platforms/wecom/inbound_receipts.py
      - runtime/tests/plugins/test_wecom_holding_bridge_v1.py
      - runtime/tests/plugins/test_xiaoyou_runtime_home_migration_v1.py
      - scripts/xiaoyou_runtime_home_migration.py
      - scripts/xiaoyou_wecom_holding_mode.py
      - deploy/config/runtime.wecom-holding.env.example
      - deploy/systemd/xiaoyou-wecom-holding-bridge.service.example
      - .github/workflows/bootstrap-holding-bridge-tests.yml

permissions:
  contents: read

jobs:
  holding-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install targeted test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile bridge runtime controls
        run: >-
          python -m py_compile
          runtime/plugins/platforms/wecom/holding_bridge.py
          scripts/xiaoyou_wecom_holding_bridge.py
          scripts/xiaoyou_wecom_holding_mode.py
      - name: Run Holding Bridge and safe-drain regression
        env:
          PYTHONPATH: runtime
        run: >-
          python -m pytest -q
          runtime/tests/plugins/test_wecom_holding_bridge_v1.py
          runtime/tests/plugins/test_wecom_callback_safe_drain_v1.py
          runtime/tests/plugins/test_xiaoyou_runtime_home_migration_v1.py
