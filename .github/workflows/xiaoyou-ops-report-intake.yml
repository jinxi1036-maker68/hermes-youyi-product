name: XiaoU Ops Report Intake

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Target pull request number"
        required: true
        type: string
      report_base64:
        description: "Base64-encoded XIAOU_OPS_REPORT_V1 JSON"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate-and-comment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact default branch
        uses: actions/checkout@v4

      - name: Validate, bind and post report
        env:
          REPORT_BASE64: ${{ inputs.report_base64 }}
          INPUT_PR: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$INPUT_PR" -gt 0

          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          from scripts.xiaoyou_ops_report_v1 import render_markdown, validate_report

          raw = base64.b64decode(os.environ["REPORT_BASE64"], validate=True)
          payload = json.loads(raw.decode("utf-8"))
          report = validate_report(payload)

          Path("/tmp/xiaou-ops-report.normalized.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          Path("/tmp/xiaou-ops-report.md").write_text(
              render_markdown(report),
              encoding="utf-8",
          )
          PY

          test -s /tmp/xiaou-ops-report.normalized.json
          test -s /tmp/xiaou-ops-report.md

          REPORT_PR="$(python -c 'import json; print(json.load(open("/tmp/xiaou-ops-report.normalized.json"))["pr_number"])')"
          REPORT_SHA="$(python -c 'import json; print(json.load(open("/tmp/xiaou-ops-report.normalized.json"))["candidate_sha"])')"

          test "$REPORT_PR" = "$INPUT_PR"

          PR_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$INPUT_PR")"
          PR_STATE="$(printf '%s' "$PR_JSON" | jq -r '.state')"
          PR_SHA="$(printf '%s' "$PR_JSON" | jq -r '.head.sha')"

          test "$PR_STATE" = "open"
          test "$REPORT_SHA" = "$PR_SHA"

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$INPUT_PR/comments" \
            -f body="$(cat /tmp/xiaou-ops-report.md)"
