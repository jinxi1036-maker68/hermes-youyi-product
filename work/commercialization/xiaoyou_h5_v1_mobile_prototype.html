<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>小优工作台 V1 移动端原型</title>
  <style>
    :root {
      --brand: #167a5a;
      --brand-dark: #0f5f46;
      --brand-soft: #eaf5f0;
      --info: #2f6fed;
      --info-soft: #edf3ff;
      --warning: #b76816;
      --warning-soft: #fff4e5;
      --danger: #c43d3d;
      --danger-soft: #fff0f0;
      --ink: #18211d;
      --secondary: #53605a;
      --muted: #7a8580;
      --line: #dfe5e2;
      --line-strong: #ccd5d0;
      --surface: #ffffff;
      --canvas: #eef2f0;
      --subtle: #f6f8f7;
      --radius: 8px;
      --shadow: 0 10px 30px rgba(23, 42, 33, 0.08);
    }

    * { box-sizing: border-box; }

    html { background: var(--canvas); }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      letter-spacing: 0;
    }

    button, input, select { font: inherit; letter-spacing: 0; }

    button { -webkit-tap-highlight-color: transparent; }

    .prototype-bar {
      width: min(430px, 100%);
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--secondary);
      background: #e5ebe8;
      border-bottom: 1px solid var(--line-strong);
    }

    .prototype-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      font-size: 13px;
    }

    .prototype-label strong { color: var(--ink); font-size: 15px; }

    .role-switch {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      width: 188px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);
    }

    .role-button {
      min-height: 36px;
      padding: 0 10px;
      border: 0;
      border-right: 1px solid var(--line);
      color: var(--secondary);
      background: var(--surface);
      cursor: pointer;
    }

    .role-button:last-child { border-right: 0; }
    .role-button.active { color: #fff; background: var(--brand); font-weight: 700; }

    .phone {
      width: min(430px, 100%);
      height: calc(100dvh - 61px);
      min-height: 620px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .app-header {
      padding: 18px 16px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      display: grid;
      place-items: center;
      border-radius: var(--radius);
      color: #fff;
      background: var(--brand);
      font-size: 20px;
      font-weight: 800;
    }

    .brand-copy { min-width: 0; flex: 1; }
    .brand-title { margin: 0; font-size: 20px; line-height: 1.25; }
    .brand-subtitle { margin-top: 2px; color: var(--secondary); font-size: 13px; line-height: 1.45; }

    .role-badge {
      flex: 0 0 auto;
      padding: 5px 8px;
      border-radius: 999px;
      color: var(--brand-dark);
      background: var(--brand-soft);
      font-size: 13px;
      font-weight: 700;
    }

    .context-row {
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .context-item {
      min-width: 0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .context-item svg { width: 14px; height: 14px; }

    .main {
      flex: 1;
      min-height: 0;
      padding-bottom: 16px;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: var(--surface);
    }

    .page-intro {
      padding: 20px 16px;
      background: var(--subtle);
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--brand-dark);
      font-size: 13px;
      font-weight: 700;
    }

    .page-title {
      margin: 8px 0 6px;
      font-size: 24px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .page-summary {
      margin: 0;
      color: var(--secondary);
      line-height: 1.65;
    }

    .section {
      padding: 20px 16px 4px;
      border-bottom: 1px solid var(--line);
    }

    .section:last-child { border-bottom: 0; }

    .section-head {
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .section-title {
      margin: 0;
      font-size: 17px;
      line-height: 1.35;
    }

    .section-note { color: var(--muted); font-size: 13px; white-space: nowrap; }

    .priority-list, .work-list, .status-list { display: grid; gap: 8px; margin-bottom: 16px; }

    .work-row {
      width: 100%;
      min-height: 68px;
      padding: 12px;
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      text-align: left;
      color: inherit;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      cursor: pointer;
    }

    .work-row:active { background: var(--subtle); }

    .row-icon {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: var(--radius);
      color: var(--brand-dark);
      background: var(--brand-soft);
    }

    .row-icon.info { color: var(--info); background: var(--info-soft); }
    .row-icon.warning { color: var(--warning); background: var(--warning-soft); }
    .row-icon.danger { color: var(--danger); background: var(--danger-soft); }
    .row-icon svg { width: 18px; height: 18px; }

    .row-copy { min-width: 0; }
    .row-title { font-size: 15px; font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }
    .row-meta { margin-top: 3px; color: var(--secondary); font-size: 13px; line-height: 1.45; overflow-wrap: anywhere; }
    .row-source { margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 1.4; }

    .row-tail {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
    }

    .row-tail svg { width: 16px; height: 16px; }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 7px;
      border-radius: 999px;
      color: var(--secondary);
      background: var(--subtle);
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge.brand { color: var(--brand-dark); background: var(--brand-soft); border-color: #cde5d9; }
    .badge.info { color: #2358bd; background: var(--info-soft); border-color: #ccdaf8; }
    .badge.warning { color: #8d4a0c; background: var(--warning-soft); border-color: #f0d8b9; }
    .badge.danger { color: #a52d2d; background: var(--danger-soft); border-color: #f2cccc; }

    .insight-band {
      margin-bottom: 16px;
      padding: 14px;
      background: var(--info-soft);
      border-left: 3px solid var(--info);
      border-radius: 0 var(--radius) var(--radius) 0;
    }

    .insight-label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #2358bd;
      font-size: 13px;
      font-weight: 700;
    }

    .insight-label svg { width: 15px; height: 15px; }
    .insight-text { margin-top: 7px; font-weight: 700; line-height: 1.55; }
    .insight-evidence { margin-top: 6px; color: var(--secondary); font-size: 13px; line-height: 1.45; }

    .status-band {
      margin-bottom: 16px;
      padding: 14px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      background: var(--brand-soft);
      border-radius: var(--radius);
    }

    .status-band.warning { background: var(--warning-soft); }
    .status-band.danger { background: var(--danger-soft); }
    .status-band > svg { width: 20px; height: 20px; flex: 0 0 20px; margin-top: 1px; color: var(--brand); }
    .status-band.warning > svg { color: var(--warning); }
    .status-band.danger > svg { color: var(--danger); }
    .status-title { font-weight: 700; line-height: 1.45; }
    .status-text { margin-top: 3px; color: var(--secondary); font-size: 13px; line-height: 1.5; }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 16px;
    }

    .metric {
      min-height: 82px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .metric-value { font-size: 20px; font-weight: 800; line-height: 1.2; }
    .metric-label { margin-top: 6px; color: var(--secondary); font-size: 13px; }
    .metric-state { margin-top: 5px; color: var(--muted); font-size: 12px; }

    .summary-line {
      margin-bottom: 16px;
      padding: 14px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .summary-line strong { display: block; font-size: 20px; }
    .summary-line span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }

    .filter-row {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
      scrollbar-width: none;
    }

    .filter-row::-webkit-scrollbar { display: none; }

    .filter-button {
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      color: var(--secondary);
      background: var(--surface);
      white-space: nowrap;
      cursor: pointer;
    }

    .filter-button.active { color: var(--brand-dark); background: var(--brand-soft); border-color: #bcdacb; font-weight: 700; }

    .search-box {
      min-height: 44px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      color: var(--muted);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .search-box svg { width: 18px; height: 18px; }

    .project-select {
      width: 100%;
      min-height: 44px;
      margin-bottom: 16px;
      padding: 0 12px;
      color: var(--ink);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .progress-steps {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      margin: 12px 0 16px;
    }

    .step {
      position: relative;
      padding-top: 18px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }

    .step::before {
      content: "";
      position: absolute;
      top: 4px;
      left: 50%;
      width: 8px;
      height: 8px;
      margin-left: -4px;
      border-radius: 50%;
      background: var(--line-strong);
    }

    .step::after {
      content: "";
      position: absolute;
      top: 7px;
      left: calc(50% + 6px);
      width: calc(100% - 12px);
      height: 2px;
      background: var(--line);
    }

    .step:last-child::after { display: none; }
    .step.done { color: var(--brand-dark); font-weight: 700; }
    .step.done::before { background: var(--brand); }
    .step.done::after { background: #9bcab5; }
    .step.current { color: var(--info); font-weight: 700; }
    .step.current::before { background: var(--info); box-shadow: 0 0 0 4px var(--info-soft); }

    .empty-state {
      margin-bottom: 16px;
      padding: 20px 16px;
      text-align: center;
      color: var(--secondary);
      background: var(--subtle);
      border-radius: var(--radius);
    }

    .empty-state svg { width: 24px; height: 24px; margin-bottom: 8px; color: var(--brand); }
    .empty-state strong { display: block; color: var(--ink); }
    .empty-state span { display: block; margin-top: 5px; font-size: 13px; line-height: 1.5; }

    .wecom-action {
      width: 100%;
      min-height: 46px;
      margin: 0 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #fff;
      background: var(--brand);
      border: 0;
      border-radius: var(--radius);
      font-weight: 700;
      cursor: pointer;
    }

    .wecom-action:active { background: var(--brand-dark); }
    .wecom-action svg { width: 18px; height: 18px; }

    .bottom-nav {
      position: relative;
      z-index: 10;
      flex: 0 0 auto;
      min-height: 66px;
      padding-bottom: env(safe-area-inset-bottom);
      display: grid;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.98);
    }

    .nav-button {
      min-width: 0;
      min-height: 64px;
      padding: 8px 4px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--muted);
      border: 0;
      background: transparent;
      font-size: 12px;
      cursor: pointer;
    }

    .nav-button svg { width: 20px; height: 20px; }
    .nav-button.active { color: var(--brand); font-weight: 700; }

    dialog {
      width: min(430px, 100%);
      max-width: none;
      margin: auto auto 0;
      padding: 0;
      color: var(--ink);
      border: 0;
      border-radius: 8px 8px 0 0;
      box-shadow: 0 -16px 44px rgba(17, 35, 27, 0.18);
    }

    dialog::backdrop { background: rgba(16, 26, 22, 0.42); }

    .dialog-head {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .dialog-title { margin: 0; font-size: 17px; }

    .icon-button {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      color: var(--secondary);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      cursor: pointer;
    }

    .icon-button svg { width: 18px; height: 18px; }

    .dialog-body { padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
    .detail-line { padding: 11px 0; border-bottom: 1px solid var(--line); }
    .detail-line:last-child { border-bottom: 0; }
    .detail-label { color: var(--muted); font-size: 12px; }
    .detail-value { margin-top: 4px; line-height: 1.55; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 88px;
      z-index: 30;
      max-width: calc(100% - 32px);
      padding: 10px 14px;
      color: #fff;
      background: #25312c;
      border-radius: var(--radius);
      transform: translateX(-50%);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
    }

    .toast.show { opacity: 1; }

    @media (min-width: 620px) {
      body { padding: 24px 0; }
      .prototype-bar { border: 1px solid var(--line-strong); border-bottom: 0; border-radius: 8px 8px 0 0; }
      .phone { height: 820px; min-height: 0; border: 1px solid var(--line-strong); border-radius: 0 0 8px 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="prototype-bar">
    <div class="prototype-label">
      <strong>V1 结构原型</strong>
      <span>示意数据</span>
    </div>
    <div class="role-switch" aria-label="切换预览角色">
      <button class="role-button active" type="button" data-role="teacher">老师</button>
      <button class="role-button" type="button" data-role="manager">店长</button>
      <button class="role-button" type="button" data-role="boss">老板</button>
    </div>
  </div>

  <div class="phone">
    <header class="app-header">
      <div class="brand-row">
        <div class="brand-mark" aria-hidden="true">优</div>
        <div class="brand-copy">
          <h1 class="brand-title">小优工作台</h1>
          <div class="brand-subtitle" id="roleSubtitle"></div>
        </div>
        <span class="role-badge" id="roleBadge"></span>
      </div>
      <div class="context-row">
        <span class="context-item"><i data-lucide="building-2"></i><span id="projectName"></span></span>
        <span class="context-item"><i data-lucide="database"></i>事实更新于10分钟前</span>
      </div>
    </header>

    <main class="main" id="mainContent"></main>
    <nav class="bottom-nav" id="bottomNav" aria-label="一级导航"></nav>
  </div>

  <dialog id="detailDialog">
    <div class="dialog-head">
      <h2 class="dialog-title" id="dialogTitle">详情</h2>
      <button class="icon-button" id="closeDialog" type="button" aria-label="关闭详情"><i data-lucide="x"></i></button>
    </div>
    <div class="dialog-body" id="dialogBody"></div>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

      button.addEventListener("click", () => {
        state.role = button.dataset.role;
        state.page = roleConfig[state.role].nav[0].id;
        document.querySelectorAll("[data-role]").forEach(item => item.classList.toggle("active", item.dataset.role === state.role));
        render();
        document.querySelector(".main").scrollTo({ top: 0, behavior: "smooth" });
      });
    });

    render();
  </script>
</body>
</html>
