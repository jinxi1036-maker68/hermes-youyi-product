name: xiaoyou-core
description: 小优数字员工当前正式启用的本地手册组合
skills:
  - xiaoyou-core-contract
  - xiaoyou-observation-evidence
instruction: |
  先确定当前服务对象和可信事实，再由模型判断该理解、查询、追问、行动、等待或停止。
  只注入当前人的个人工作方式和任务上下文。手册是判断材料，不得变成固定 Router。
  真实数据、写入和外发必须经过权限、幂等、审计、写后反查和回执边界。
  本组合只列出当前实际安装并启用的本地小优手册；历史名称或规划名称不是可用能力。
