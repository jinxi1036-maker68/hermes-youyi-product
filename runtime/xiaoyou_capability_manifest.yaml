capability:
  name: xiaoyou
  version: 1.2.20-identity-authority-candidate
  baseline_kind: identity-authority-candidate
  hermes_runtime:
    required_version: 0.21.0
    core_vendored: false
    supported_public_surfaces:
      - plugin_loading
      - platform_adapter
      - public_agent_turn_ingress
      - tool_registration
      - skills
      - session_and_context
      - streaming

modules:
  - tuoguan_core
  - agenda_service_work
  - reply_recovery
  - platforms.wecom
  - platforms.http_policy
  - robot_poc

runtime_contract:
  trusted_turn_context: true
  permission_and_scope_enforcement: true
  command_bus_and_idempotency: true
  execution_receipt_and_writeback_verification: true
  reply_truth_and_durable_outbox: true
  work_runtime_and_trusted_partition: true
  agenda_and_persistent_continuation: true
  institution_workspace_is_separate_from_runtime: true
  personnel_identity_authority_opt_in_and_fail_closed: true

current_local_skills:
  - xiaoyou-core-contract
  - xiaoyou-observation-evidence

channels:
  production_primary: wecom_callback
  isolated_or_optional:
    - robot_poc

source_policy:
  include: source_code_skills_templates_tests_docs
  exclude: production_workspace_ledgers_sessions_logs_caches_backups_secrets
  legacy_assets_are_preserved_without_claiming_runtime_use: true
